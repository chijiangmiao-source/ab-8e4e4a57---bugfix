services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: relay-audit:latest
    ports:
      # Host port is configurable via RELAY_AUDIT_PORT (default 8000).
      - "${RELAY_AUDIT_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3); sys.exit(0 if r.status==200 and json.load(r)['status']=='available' else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  verify:
    build:
      context: .
      dockerfile: Dockerfile
    image: relay-audit:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    # Runs the test suite, an application build/import check and an HTTP
    # smoke test (diamond bypass, serial critical point, parallel edges,
    # unreachable terminal), then exits with a conclusive status code.
    command: ["python", "verify.py"]
